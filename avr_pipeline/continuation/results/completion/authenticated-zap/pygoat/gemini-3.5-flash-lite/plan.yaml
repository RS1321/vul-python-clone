    - 'Cookie: <EPHEMERAL_FIXTURE_AUTH>'
    responseCode: 200
  - url: http://127.0.0.1:18620/scoring/scores/
    method: GET
    headers:
    - 'Cookie: <EPHEMERAL_FIXTURE_AUTH>'
    responseCode: 200
  - url: http://127.0.0.1:18620/scoring/achievements/
    method: GET
    headers:
    - 'Cookie: <EPHEMERAL_FIXTURE_AUTH>'
    responseCode: 200
- type: passiveScan-wait
