name: AVR pipeline checks
on:
  workflow_dispatch:
  push:
    branches:
      - codex/manuscript-evaluation
    paths:
      - 'avr_pipeline/**'
      - '.github/workflows/avr-pipeline-checks.yml'
  pull_request:
    paths:
      - 'avr_pipeline/**'
      - '.github/workflows/avr-pipeline-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: avr_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest review_tests -q --basetemp=.review-work/ci-checks
      - run: python review/smoke.py --out .review-work/ci-smoke
