name: AVR pipeline checks
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/manuscript-evaluation
    paths:
      - 'avr_pipeline/**'
      - '.github/workflows/avr-pipeline-checks.yml'
  pull_request:
    paths:
      - 'avr_pipeline/**'
      - '.github/workflows/avr-pipeline-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: avr_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest review_tests -q --basetemp=.review-work/ci-checks
      - run: python review/smoke.py --out .review-work/ci-smoke
  linux-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned scanner and pipeline image
        run: docker build --progress=plain --tag avr-review2 ./avr_pipeline
      - name: Verify installed scanners and pinned baseline
        run: |
          mkdir -p container-evidence
          docker run --rm --volume "$PWD/container-evidence:/evidence" avr-review2 python review/container_check.py --out /evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-scanner-evidence
          path: container-evidence
